<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #fff7e8;
        --ink: #1f2a44;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        background: var(--ground);
      }
      #paper {
        position: absolute;
        inset: 0;
        background-color: var(--ground);
        background-image:
          linear-gradient(rgba(31, 42, 68, 0.06) 2px, transparent 2px),
          linear-gradient(90deg, rgba(31, 42, 68, 0.06) 2px, transparent 2px);
        background-size: 48px 48px;
      }
    </style>
  </head>
  <body>
    <div
